# .sourcecraft/workflows/build-site.yml
on:
  push:
    branches:
      - main

workflows:
  build-and-release:
    name: Build MkDocs and create release branch
    tasks:
      - name: build-site
        cubes:
          - name: install-deps-and-build
            image: docker.io/library/python:3.13-slim
            script: |
              echo "Installing dependencies..."
              python -m pip install --upgrade pip
              python -m pip install mkdocs mkdocs-material
              
              if [ -f requirements.txt ]; then
                python -m pip install -r requirements.txt
              fi
              
              echo "Building site from ./site folder..."
              cd site
              python -m mkdocs build -d ../docs
              
              echo "Site built successfully"
              echo "Contents of ./docs:"
              ls -la ../docs
              
      - name: update-release-branch
        cubes:
          - name: configure-git
            image: docker.io/library/alpine/git:latest
            script: |
              echo "Configuring git..."
              git config --global user.name "SourceCraft Bot"
              git config --global user.email "bot@sourcecraft.dev"
              
              echo "Fetching all branches..."
              git fetch --all
              
          - name: create-or-update-release
            image: docker.io/library/alpine/git:latest
            script: |
              echo "Processing release branch..."
              
              # Проверяем существование ветки release на удалённом репозитории
              if git ls-remote --heads origin release | grep -q release; then
                echo "Branch 'release' exists, updating..."
                git checkout release
                git pull origin release
                git merge main --no-edit || echo "Merge conflicts handled automatically"
              else
                echo "Creating new branch 'release'..."
                git checkout -b release
                echo "Pushing new branch to remote..."
                git push -u origin release
              fi
              
              # Добавляем docs папку в коммит
              echo "Adding docs folder to git..."
              git add docs/
              
              # Проверяем, есть ли изменения для коммита
              if git diff --staged --quiet; then
                echo "No changes to commit"
              else
                echo "Committing changes..."
                git commit -m "Auto-deploy: $(date '+%Y-%m-%d %H:%M:%S')"
                echo "Pushing to remote..."
                git push origin release
                echo "Changes pushed to release branch"
              fi
              
              echo "Release branch update complete!"