name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: Install MkDocs
        run: |
          pip install mkdocs mkdocs-material
          
      - name: Build site
        run: |
          # mkdocs.yml в корне, а исходники в папке site
          mkdocs build
          
      - name: Create/Update release branch
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git fetch --all
          git checkout release || git checkout -b release
          # Сайт собрался в папку site (если site_dir не указан)
          # Проверяем, куда собрался сайт
          ls -la
          git add site/
          git commit -m "Auto-build: $(date -u)" || echo "No changes"
          git push origin release --force